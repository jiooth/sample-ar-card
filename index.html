<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <!-- Solid Camera Libraries -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
      
      /* 3D AR Canvas ko background mein rakhne ke liye */
      a-scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

      /* BUTTONS PANEL: Isko screen ke thoda upar set kiya hai taaki neeche se bahar na jaye */
      .button-container {
        position: fixed;
        bottom: 40px; /* Isko badha kar upar kar diya hai */
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 360px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 99999; /* Yeh hamesha camera ke upar dikhega aur touch kaam karega */
      }

      /* Premium Button Styles */
      .btn {
        width: 100%;
        padding: 12px 0;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        color: white;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        cursor: pointer;
        display: block;
      }

      .btn-biz {
        background: linear-gradient(135deg, #ff9900, #ff5500);
      }
      
      .btn-row {
        display: flex;
        gap: 10px;
        width: 100%;
      }
      
      .btn-call {
        background: linear-gradient(135deg, #007bb5, #005580);
        flex: 1;
      }
      
      .btn-wa {
        background: linear-gradient(135deg, #25D366, #128C7E);
        flex: 1;
      }
    </style>
  </head>
  <body>

    <!-- 1. REAL NORMAL HTML BUTTONS (Camera se bilkul alag aur upar) -->
    <div class="button-container">
      <!-- Business Opportunity Link -->
      <a href="https://my-profile-10.blogspot.com/p/business-oppertunity.html" target="_top" class="btn btn-biz">
        BUSINESS OPPORTUNITY
      </a>

      <!-- Call aur WhatsApp Bagal-Bagal mein -->
      <div class="btn-row">
        <a href="tel:+918129848820" target="_top" class="btn btn-call">
          CALL ME
        </a>
        <a href="https://wa.me/918129848820?text=Hi,%20I%20am%20interested%20in%20your%20business." target="_top" class="btn btn-wa">
          WHATSAPP
        </a>
      </div>
    </div>

    <!-- 2. SOLID AR CAMERA ENGINE -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="card-video" src="./myvideo.mp4" preload="auto" loop="true" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Zone: Scan hote hi sirf video dikhegi, buttons humne upar HTML mein daal diye hain -->
      <a-entity id="my-target" mindar-image-target="targetIndex: 0">
        <a-video src="#card-video" width="1" height="0.56" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#my-target');
      const videoElement = document.querySelector('#card-video');

      // Video play/pause logic on scan
      targetEntity.addEventListener("targetFound", () => {
        videoElement.play();
      });
      targetEntity.addEventListener("targetLost", () => {
        videoElement.pause();
      });
    </script>
  </body>
</html>
