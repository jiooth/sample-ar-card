<!DOCTYPE html>
<html lang="hi">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WebVR/AR aur MindAR Libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* Overlay UI Buttons Container */
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 85%;
            max-width: 320px;
            font-family: Arial, sans-serif;
        }
        /* Action Buttons Styling */
        .ar-btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .ar-btn:active {
            transform: scale(0.95);
        }
        /* Specific Button Colors */
        .biz-btn {
            background: linear-gradient(135deg, #ff9900, #ff5500);
        }
        .call-btn {
            background: linear-gradient(135deg, #007bb5, #005580);
        }
        .wa-btn {
            background: linear-gradient(135deg, #25D366, #075E54);
        }
    </style>
</head>
<body>

    <!-- AR Scene Setup (Yahan targets.mind file ka sahi path hona chahiye) -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.001; filterBeta:0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Aapki video file aur uski settings -->
            <video id="card-video" src="./myvideo.mp4" preload="auto" loop="true" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target Index 0 (Jab camera card ko scan karega) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Video Plane: Yeh card ke upar 3D me dikhega -->
            <a-video src="#card-video" position="0 0 0" height="0.55" width="1" rotation="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <!-- Screen ke upar dikhne wale Buttons -->
    <div id="ui-container">
        <a href="https://my-profile-10.blogspot.com/p/business-oppertunity.html" target="_blank" class="ar-btn biz-btn">
            💼 BUSINESS OPPERTUNITY
        </a>
        <a href="tel:+918129848820" id="call-link" class="ar-btn call-btn">
            📞 CALL ME
        </a>
        <a href="https://wa.me/918129848820?text=Hi,%20I%20scanned%20your%20AR%20Business%20Card." target="_blank" id="wa-link" class="ar-btn wa-btn">
            💬 WHATSAPP
        </a>
    </div>

    <script>
        // Video Auto-play logic jab target scan ho jaye
        const sceneEl = document.querySelector('a-scene');
        const videoEl = document.querySelector('#card-video');
        const targetEl = document.querySelector('[mindar-image-target]');

        targetEl.addEventListener("targetFound", event => {
            console.log("Target found! Playing video...");
            videoEl.play();
        });

        targetEl.addEventListener("targetLost", event => {
            console.log("Target lost! Pausing video...");
            videoEl.pause();
        });
    </script>
</body>
</html>
