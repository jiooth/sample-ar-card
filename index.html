<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame aur MindAR libraries -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Poori screen ko transparent aur clean rakhne ke liye */
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: transparent; }
      /* Faltu loading ya blue screens ko block karne ke liye */
      .a-canvas { background-color: transparent !important; }
    </style>
  </head>
  <body>

    <!-- UI ke saare faltu elements (loading aur VR buttons) band kar diye hain -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no;" cursor="rayOrigin: mouse" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 1. Aapki Video -->
        <video id="card-video" src="./myvideo.mp4" preload="auto" loop="true" playsinline></video>
        
        <!-- 2. Buttons ke Icons -->
        <img id="biz-icon" src="https://cdn-icons-png.flaticon.com/512/3061/3061341.png">
        <img id="call-icon" src="https://cdn-icons-png.flaticon.com/512/3616/3616215.png">
        <img id="wa-icon" src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Zone -->
      <a-entity id="my-target" mindar-image-target="targetIndex: 0">
        
        <!-- Aapki Video -->
        <a-video src="#card-video" width="1" height="0.56" position="0 0.2 0"></a-video>

        <!-- Buttons -->
        <a-image id="btn-biz" src="#biz-icon" width="0.8" height="0.18" position="0 -0.25 0.1" class="clickable"></a-image>
        <a-image id="btn-call" src="#call-icon" width="0.35" height="0.15" position="-0.22 -0.45 0.1" class="clickable"></a-image>
        <a-image id="btn-wa" src="#wa-icon" width="0.35" height="0.15" position="0.22 -0.45 0.1" class="clickable"></a-image>

      </a-entity>
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#my-target');
      const videoElement = document.querySelector('#card-video');

      // Scan Control logic
      targetEntity.addEventListener("targetFound", () => { videoElement.play(); });
      targetEntity.addEventListener("targetLost", () => { videoElement.pause(); });

      // Click Actions
      document.querySelector('#btn-biz').addEventListener("click", () => {
        window.open("https://my-profile-10.blogspot.com/p/business-oppertunity.html", "_top");
      });

      document.querySelector('#btn-call').addEventListener("click", () => {
        window.open("tel:+918129848820", "_top");
      });

      document.querySelector('#btn-wa').addEventListener("click", () => {
        window.open("https://wa.me/918129848820?text=Hi,%20I%20am%20interested%20in%20your%20business.", "_top");
      });
    </script>
  </body>
</html>
